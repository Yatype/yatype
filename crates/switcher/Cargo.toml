[package]
name = "switcher"
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Yatype — исправляет текст, набранный не в той раскладке"

[dependencies]
detector = { version = "0.1.0", path = "../detector" }
engine = { version = "0.1.0", path = "../engine" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_Security"] }

[build-dependencies]
embed-resource = "3.0.12"
